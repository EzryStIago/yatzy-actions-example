name: linting

on: [push]

jobs:
  lint_yatzy1:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: Pylint
      run: |
        export PYLINTRC=./.github/workflows/.pylintrc
        pylint $(find ./python -name '*.py')  --fail-under=7
